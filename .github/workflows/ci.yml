name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  precommit:
    name: mix precommit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # file_system needs inotify-tools for the serve tests.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.x"
          elixir-version: "1.20.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plts-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plts-

      # Setup only below; the one and only quality gate is `mix precommit`.
      - run: mix deps.get
      - run: npm ci
      - run: mix precommit

      # Dogfood the generator: a fresh `cherry.new` site must build and
      # check clean against this very checkout.
      - name: cherry.new dogfood
        if: runner.os == 'Linux'
        working-directory: installer
        run: |
          mix cherry.new /tmp/orchard --cherry-path "$GITHUB_WORKSPACE"
          cd /tmp/orchard
          mix deps.get
          mix cherry.build
          mix cherry.check --strict
